openapi: 3.1.0
info:
  title: API Biblioteca
  version: 1.0.0
  description: Documentación de la API de Biblioteca

tags:
  - name: Authors
    description: Endpoints para gestionar autores

  - name: Categories
    description: Endpoints para gestionar categorías

paths:

  ########################################
  #              AUTHORS
  ########################################

  /authors:
    get:
      tags: [Authors]
      summary: Obtener todos los autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorsDto'

    post:
      tags: [Authors]
      summary: Crear un nuevo autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorsCreatedDh'
      responses:
        '200':
          description: Autor creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDto'

  /authors/id/{id}:
    get:
      tags: [Authors]
      summary: Buscar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDto'

    delete:
      tags: [Authors]
      summary: Eliminar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Authors]
      summary: Actualizar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorsUpdatedDh'
      responses:
        '200':
          description: Autor actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDto'

  /authors/name/{name}:
    get:
      tags: [Authors]
      summary: Buscar autores por nombre
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Gabriel"
      responses:
        '200':
          description: Lista de autores que coinciden con el nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorsDto'


  ########################################
  #              CATEGORIES
  ########################################

  /categories:
    get:
      tags: [Categories]
      summary: Obtener todas las categorías
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriesDto'

    post:
      tags: [Categories]
      summary: Crear una nueva categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesCreatedDh'
      responses:
        '200':
          description: Categoría creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesDto'

  /categories/id/{id}:
    get:
      tags: [Categories]
      summary: Buscar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesDto'

    delete:
      tags: [Categories]
      summary: Eliminar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Categories]
      summary: Actualizar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesUpdatedDh'
      responses:
        '200':
          description: Categoría actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesDto'

  /categories/name/{name}:
    get:
      tags: [Categories]
      summary: Buscar categorías por nombre o subtema
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Ficción"
      responses:
        '200':
          description: Lista de categorías encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriesDto'


components:
  schemas:

    ########################################
    #              AUTHORS SCHEMAS
    ########################################

    AuthorsDto:
      type: object
      properties:
        authorId:
          type: integer
          example: 12
        nameAuthor:
          type: string
          example: "Gabriel García Márquez"

    AuthorsCreatedDh:
      type: object
      required:
        - nameAuthor
      properties:
        nameAuthor:
          type: string
          minLength: 4
          maxLength: 100
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Isabel Allende"

    AuthorsUpdatedDh:
      type: object
      required:
        - authorId
        - nameAuthor
      properties:
        authorId:
          type: integer
          minimum: 1
          example: 5
        nameAuthor:
          type: string
          minLength: 4
          maxLength: 100
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Mario Vargas Llosa"


    ########################################
    #              CATEGORIES SCHEMAS
    ########################################

    CategoriesDto:
      type: object
      properties:
        categoryId:
          type: integer
          example: 5
        nameCategory:
          type: string
          example: "Ciencia Ficción"
        subtopicCategory:
          type: string
          example: "Robots"

    CategoriesCreatedDh:
      type: object
      required:
        - nameCategory
      properties:
        nameCategory:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Fantasía"
        subtopicCategory:
          type: string
          maxLength: 30
          example: "Épica"

    CategoriesUpdatedDh:
      type: object
      required:
        - categoryId
        - nameCategory
      properties:
        categoryId:
          type: integer
          minimum: 1
          example: 3
        nameCategory:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Distopía"
        subtopicCategory:
          type: string
          maxLength: 30
          example: "Política"
