openapi: 3.1.0
info:
  title: API Biblioteca
  version: 1.0.0
  description: Documentación de la API de Biblioteca

tags:
  - name: Authors
    description: Endpoints para gestionar autores

  - name: Categories
    description: Endpoints para gestionar categorías de libros

  - name: Users
    description: Endpoints para gestionar usuarios

  - name: Loans
    description: Endpoints para gestionar préstamos de libros

  - name: Histories
    description: Endpoints para gestionar historiales de feedback de préstamos


paths:

  ########################################
  #              AUTHORS
  ########################################

  /authors:
    get:
      tags: [Authors]
      summary: Obtener todos los autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorsDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    post:
      tags: [Authors]
      summary: Crear un nuevo autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorsCreatedDh'
      responses:
        '201':
          description: Autor creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthorsDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"
              example:
                data:
                  authorId: 12
                  nameAuthor: "Gabriel García Márquez"
                timestamp: "23/03/2026, 12:24:31"

  /authors/id/{id}:
    get:
      tags: [Authors]
      summary: Buscar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthorsDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    delete:
      tags: [Authors]
      summary: Eliminar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    put:
      tags: [Authors]
      summary: Actualizar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorsUpdatedDh'
      responses:
        '200':
          description: Autor actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthorsDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

  /authors/name/{name}:
    get:
      tags: [Authors]
      summary: Buscar autores por nombre
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Gabriel"
      responses:
        '200':
          description: Lista de autores que coinciden con el nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthorsDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  ########################################
  #              PUBLISHERS
  ########################################

  /publishers:
    post:
      tags: [ Publishers ]
      summary: Crear un nuevo publisher
      description: Crea un nuevo registro de editorial en la base de datos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishersCreatedRecordDh'
            example:
              publisherId: 6
              namePublisher: "HarperCollins"
              address: "Calle Nueva 10"
              city: "Madrid"
              province: "Madrid"
              postalCode: "28001"
              country: "España"
              phone: "+34-910000006"
              notes: "Editorial internacional"
      responses:
        '201':
          description: Publisher creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '409':
          description: El publisherId ya existe
        '500':
          description: Error interno al guardar el publisher

    get:
      tags: [ Publishers ]
      summary: Obtener todos los publishers
      description: Devuelve la lista completa de editoriales.
      responses:
        '200':
          description: Lista de publishers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishersDto'

  /publishers/id/{id}:
    get:
      tags: [ Publishers ]
      summary: Buscar publisher por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Publisher encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: No existe un publisher con ese ID

    put:
      tags: [ Publishers ]
      summary: Actualizar un publisher por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishersUpdatedRecordDh'
            example:
              publisherId: 1
              namePublisher: "Penguin Random House"
              address: "Calle Mayor 12"
              city: "Madrid"
              province: "Madrid"
              postalCode: "28013"
              country: "España"
              phone: "+34-910000001"
              notes: "Editorial internacional"
      responses:
        '200':
          description: Publisher actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: No existe un publisher con ese ID
        '400':
          description: El publisherId del body no coincide con el ID del path
        '500':
          description: Error interno al actualizar el publisher

    delete:
      tags: [ Publishers ]
      summary: Eliminar un publisher por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Publisher eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"
        '404':
          description: No existe un publisher con ese ID
        '409':
          description: No se puede eliminar porque tiene libros asociados
        '500':
          description: Error interno al eliminar el publisher

  /publishers/name/{name}:
    get:
      tags: [ Publishers ]
      summary: Buscar publishers por nombre
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Planeta"
      responses:
        '200':
          description: Lista de publishers encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: No existen publishers con ese nombre


  ########################################
  #              CATEGORIES
  ########################################

  /categories:
    get:
      tags: [ Categories ]
      summary: Obtener todas las categorías
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoriesDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    post:
      tags: [ Categories ]
      summary: Crear una nueva categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesCreatedDh'
      responses:
        '201':
          description: Categoría creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoriesDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"
            example:
              data:
                categoryId: 10
                nameCategory: "Ficción"
              timestamp: "23/03/2026, 12:24:31"


  /categories/id/{id}:
    get:
      tags: [ Categories ]
      summary: Buscar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoriesDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    delete:
      tags: [ Categories ]
      summary: Eliminar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    put:
      tags: [ Categories ]
      summary: Actualizar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesUpdatedDh'
      responses:
        '200':
          description: Categoría actualizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoriesDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /categories/name/{name}:
    get:
      tags: [ Categories ]
      summary: Buscar categorías por nombre o subtema
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Ficción"
      responses:
        '200':
          description: Lista de categorías encontradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoriesDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"



  ########################################
  #                 USERS
  ########################################

  /users:
    get:
      tags: [ Users ]
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsersDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    post:
      tags: [ Users ]
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersCreatedDh'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsersDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"
            example:
              data:
                userId: 8
                nameUser: "Carlos Pérez"
                emailUser: "carlos@example.com"
              timestamp: "23/03/2026, 12:24:31"


  /users/id/{id}:
    get:
      tags: [ Users ]
      summary: Buscar usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsersDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    delete:
      tags: [ Users ]
      summary: Eliminar usuario por ID (borrado físico)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    put:
      tags: [ Users ]
      summary: Actualizar usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersUpdatedDh'
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UsersDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /users/name/{name}:
    get:
      tags: [ Users ]
      summary: Buscar usuarios por nombre
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Carlos"
      responses:
        '200':
          description: Lista de usuarios encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsersDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /users/drop/id/{id}:
    delete:
      tags: [ Users ]
      summary: Borrado lógico de usuario por ID.
      description: >
        No se da de baja físicamente en la BD al usuario.
        Se pone a true el campo userDrop para indicar a la aplicación que es un usuario dado de baja.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Resultado del borrado lógico
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

  /users/password:
    put:
      tags: [ Users ]
      summary: Cambiar contraseña de un usuario
      description: >
        Cambia la contraseña de un usuario verificando DNI, email y teléfono.
        La nueva contraseña debe coincidir con `passwordRepeat` y cumple las reglas de seguridad.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersChangePassword'
            example:
              dni: "12345678A"
              email: "user@example.com"
              phone: "+34123456789"
              password: "NewPasswordAA1"
              passwordRepeat: "NewPasswordAA1"
      responses:
        '200':
          description: Contraseña cambiada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"
        '400':
          description: Error de validación o passwords no coinciden
        '404':
          description: No existe un usuario con los datos proporcionados
        '500':
          description: Error interno al guardar la nueva contraseña


  ########################################
  #                 BOOKS
  ########################################

  /books:
    get:
      tags: [ Books ]
      summary: Obtener todos los libros (versión completa)
      responses:
        '200':
          description: Lista completa de libros
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BooksDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    post:
      tags: [ Books ]
      summary: Crear un nuevo libro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BooksRecordDh'
      responses:
        '201':
          description: Libro creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"
            example:
              data:
                isbn: "9781234567895"
                title: "Fundación"
                authorId: 1
              timestamp: "23/03/2026, 12:24:31"


  /books/public:
    get:
      tags: [ Books ]
      summary: Obtener todos los libros (vista pública)
      responses:
        '200':
          description: Lista pública de libros
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BooksPublicDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/private:
    get:
      tags: [ Books ]
      summary: Obtener todos los libros (vista privada)
      responses:
        '200':
          description: Lista privada de libros
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BooksPublicDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/isbn/{isbn}:
    get:
      tags: [ Books ]
      summary: Buscar libro por ISBN (versión completa)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
            example: "9781234567895"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    delete:
      tags: [ Books ]
      summary: Eliminar libro por ISBN (incluye borrado físico de ficheros)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
            example: "9781234567895"
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"

    put:
      tags: [ Books ]
      summary: Actualizar libro por ISBN (sin subir ficheros)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
            example: "9781234567895"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BooksRecordDh'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/public/isbn/{isbn}:
    get:
      tags: [ Books ]
      summary: Buscar libro por ISBN (vista pública)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksPublicIsbnDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/private/isbn/{isbn}:
    get:
      tags: [ Books ]
      summary: Buscar libro por ISBN (vista privada)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksPublicIsbnDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/title/{name}:
    get:
      tags: [ Books ]
      summary: Buscar libros por título (contiene)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 55
            example: "Fundación"
      responses:
        '200':
          description: Lista de libros encontrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BooksPublicDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/private/file/{isbn}:
    get:
      tags: [ Books ]
      summary: Obtener ruta del fichero PDF (privado)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Ruta del fichero PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksFileDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/public/file/{isbn}:
    get:
      tags: [ Books ]
      summary: Obtener ruta del fichero PDF (público)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Ruta del fichero PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksFileDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  /books/{isbn}/files:
    put:
      tags: [ Books ]
      summary: Subir portada y fichero PDF de un libro
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bookCover:
                  type: string
                  format: binary
                bookFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: Ficheros actualizados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BooksDto'
                  timestamp:
                    type: string
                    example: "23/03/2026, 12:24:31"


  ########################################
  #                 LOANS
  ########################################

  /loans:
    get:
      tags: [ Loans ]
      summary: Obtener todos los préstamos
      responses:
