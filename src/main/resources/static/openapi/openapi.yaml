components:
  schemas:

    ########################################
    #              AUTHORS SCHEMAS
    ########################################

    AuthorsDto:
      type: object
      properties:
        authorId:
          type: integer
          example: 12
        nameAuthor:
          type: string
          example: "Gabriel García Márquez"

    AuthorsCreatedDh:
      type: object
      required:
        - nameAuthor
      properties:
        nameAuthor:
          type: string
          minLength: 4
          maxLength: 100
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Isabel Allende"

    AuthorsUpdatedDh:
      type: object
      required:
        - authorId
        - nameAuthor
      properties:
        authorId:
          type: integer
          minimum: 1
          example: 5
        nameAuthor:
          type: string
          minLength: 4
          maxLength: 100
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Mario Vargas Llosa"

    ########################################
    #              PUBLISHERS SCHEMAS
    ########################################

    PublishersCreatedRecordDh:
      type: object
      required:
        - publisherId
        - namePublisher
      properties:
        publisherId:
          type: integer
          example: 6
        namePublisher:
          type: string
          maxLength: 100
          example: "HarperCollins"
        address:
          type: string
          maxLength: 100
          example: "Calle Nueva 10"
        city:
          type: string
          maxLength: 40
          example: "Madrid"
        province:
          type: string
          maxLength: 30
          example: "Madrid"
        postalCode:
          type: string
          maxLength: 20
          example: "28001"
        country:
          type: string
          maxLength: 30
          example: "España"
        phone:
          type: string
          maxLength: 16
          example: "+34-910000006"
        notes:
          type: string
          maxLength: 255
          example: "Editorial internacional"

