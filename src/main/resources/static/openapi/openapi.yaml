openapi: 3.1.0
info:
  title: API Biblioteca
  version: 1.0.0
  description: Documentación de la API de Biblioteca

tags:
  - name: Authors
    description: Endpoints para gestionar autores

  - name: Categories
    description: Endpoints para gestionar categorías

  - name: Users
    description: Endpoints para gestionar usuarios

  - name: Loans
    description: Endpoints para gestionar préstamos de libros

  - name: Histories
    description: Endpoints para gestionar historiales de feedback de préstamos


paths:

  ########################################
  #              AUTHORS
  ########################################

  /authors:
    get:
      tags: [Authors]
      summary: Obtener todos los autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorsDto'

    post:
      tags: [Authors]
      summary: Crear un nuevo autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorsCreatedDh'
      responses:
        '200':
          description: Autor creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDto'

  /authors/id/{id}:
    get:
      tags: [Authors]
      summary: Buscar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDto'

    delete:
      tags: [Authors]
      summary: Eliminar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Authors]
      summary: Actualizar autor por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorsUpdatedDh'
      responses:
        '200':
          description: Autor actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDto'

  /authors/name/{name}:
    get:
      tags: [Authors]
      summary: Buscar autores por nombre
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Gabriel"
      responses:
        '200':
          description: Lista de autores que coinciden con el nombre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorsDto'


  ########################################
  #              CATEGORIES
  ########################################

  /categories:
    get:
      tags: [Categories]
      summary: Obtener todas las categorías
      responses:
        '200':
          description: Lista de categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriesDto'

    post:
      tags: [Categories]
      summary: Crear una nueva categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesCreatedDh'
      responses:
        '200':
          description: Categoría creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesDto'

  /categories/id/{id}:
    get:
      tags: [Categories]
      summary: Buscar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesDto'

    delete:
      tags: [Categories]
      summary: Eliminar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Categories]
      summary: Actualizar categoría por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriesUpdatedDh'
      responses:
        '200':
          description: Categoría actualizada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesDto'

  /categories/name/{name}:
    get:
      tags: [Categories]
      summary: Buscar categorías por nombre o subtema
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Ficción"
      responses:
        '200':
          description: Lista de categorías encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoriesDto'


  ########################################
  #                 USERS
  ########################################

  /users:
    get:
      tags: [ Users ]
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsersDto'

    post:
      tags: [ Users ]
      summary: Crear un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersCreatedDh'
      responses:
        '200':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersDto'


  /users/id/{id}:
    get:
      tags: [ Users ]
      summary: Buscar usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersDto'

    delete:
      tags: [ Users ]
      summary: Eliminar usuario por ID (borrado físico)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [ Users ]
      summary: Actualizar usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersUpdatedDh'
      responses:
        '200':
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersDto'


  /users/name/{name}:
    get:
      tags: [ Users ]
      summary: Buscar usuarios por nombre
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            example: "Carlos"
      responses:
        '200':
          description: Lista de usuarios encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsersDto'


  /users/drop/id/{id}:
    delete:
      tags: [ Users ]
      summary: Borrado lógico de usuario por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 8
      responses:
        '200':
          description: Resultado del borrado lógico
          content:
            application/json:
              schema:
                type: boolean
                example: true


  ########################################
  #                 BOOKS
  ########################################

  /books:
    get:
      tags: [Books]
      summary: Obtener todos los libros (versión completa)
      responses:
        '200':
          description: Lista completa de libros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BooksDto'

    post:
      tags: [ Books ]
      summary: Crear un nuevo libro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BooksRecordDh'
      responses:
        '200':
          description: Libro creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksDto'

  /books/public:
    get:
      tags: [Books]
      summary: Obtener todos los libros (vista pública)
      responses:
        '200':
          description: Lista pública de libros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BooksPublicDto'

  /books/private:
    get:
      tags: [Books]
      summary: Obtener todos los libros (vista privada)
      responses:
        '200':
          description: Lista privada de libros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BooksPublicDto'

  /books/isbn/{isbn}:
    get:
      tags: [Books]
      summary: Buscar libro por ISBN (versión completa)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
            example: "9781234567895"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksDto'

    delete:
      tags: [Books]
      summary: Eliminar libro por ISBN (incluye borrado físico de ficheros)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
            example: "9781234567895"
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Books]
      summary: Actualizar libro por ISBN (sin subir ficheros)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
            example: "9781234567895"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BooksRecordDh'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksDto'

  /books/public/isbn/{isbn}:
    get:
      tags: [Books]
      summary: Buscar libro por ISBN (vista pública)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksPublicIsbnDto'

  /books/private/isbn/{isbn}:
    get:
      tags: [Books]
      summary: Buscar libro por ISBN (vista privada)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksPublicIsbnDto'

  /books/title/{name}:
    get:
      tags: [Books]
      summary: Buscar libros por título (contiene)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            maxLength: 55
            example: "Fundación"
      responses:
        '200':
          description: Lista de libros encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BooksPublicDto'

  /books/private/file/{isbn}:
    get:
      tags: [Books]
      summary: Obtener ruta del fichero PDF (privado)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Ruta del fichero PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksFileDto'

  /books/public/file/{isbn}:
    get:
      tags: [Books]
      summary: Obtener ruta del fichero PDF (público)
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Ruta del fichero PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksFileDto'

  /books/{isbn}/files:
    put:
      tags: [Books]
      summary: Subir portada y fichero PDF de un libro
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bookCover:
                  type: string
                  format: binary
                bookFile:
                  type: string
                  format: binary
      responses:
        '200':
          description: Ficheros actualizados correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksDto'

  ########################################
  #                 LOANS
  ########################################

  /loans:
    get:
      tags: [Loans]
      summary: Obtener todos los préstamos
      responses:
        '200':
          description: Lista de préstamos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoansDto'

    post:
      tags: [Loans]
      summary: Crear un nuevo préstamo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoansRecordDh'
      responses:
        '200':
          description: Préstamo creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoansDto'


  /loans/id/{id}:
    get:
      tags: [Loans]
      summary: Buscar préstamo por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Préstamo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoansDto'

    delete:
      tags: [Loans]
      summary: Eliminar préstamo por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Loans]
      summary: Actualizar préstamo por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoansUpdateRecordDh'
      responses:
        '200':
          description: Préstamo actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoansDto'


  /loans/userid/{id}:
    get:
      tags: [Loans]
      summary: Buscar préstamos por ID de usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Lista de préstamos del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoansDto'


  /loans/isbn/{isbn}:
    get:
      tags: [Loans]
      summary: Buscar préstamos por ISBN
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
            example: "9781234567895"
      responses:
        '200':
          description: Lista de préstamos del libro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoansDto'

  ########################################
  #               HISTORIES
  ########################################

  /histories:
    get:
      tags: [Histories]
      summary: Obtener todos los historiales de feedback
      responses:
        '200':
          description: Lista de historiales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoriesDto'

    post:
      tags: [Histories]
      summary: Crear un nuevo historial de feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoriesRecordDh'
      responses:
        '200':
          description: Historial creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoriesDto'


  /histories/id/{id}:
    get:
      tags: [Histories]
      summary: Buscar historial por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Historial encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoriesDto'

    delete:
      tags: [Histories]
      summary: Eliminar historial por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Resultado de la eliminación
          content:
            application/json:
              schema:
                type: boolean
                example: true

    put:
      tags: [Histories]
      summary: Actualizar historial por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoriesUpdatedRecordDh'
      responses:
        '200':
          description: Historial actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoriesDto'


  /histories/loans/{id}:
    get:
      tags: [Histories]
      summary: Buscar historiales por ID de préstamo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Lista de historiales asociados al préstamo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoriesDto'


components:
  schemas:

    ########################################
    #              AUTHORS SCHEMAS
    ########################################

    AuthorsDto:
      type: object
      properties:
        authorId:
          type: integer
          example: 12
        nameAuthor:
          type: string
          example: "Gabriel García Márquez"

    AuthorsCreatedDh:
      type: object
      required:
        - nameAuthor
      properties:
        nameAuthor:
          type: string
          minLength: 4
          maxLength: 100
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Isabel Allende"

    AuthorsUpdatedDh:
      type: object
      required:
        - authorId
        - nameAuthor
      properties:
        authorId:
          type: integer
          minimum: 1
          example: 5
        nameAuthor:
          type: string
          minLength: 4
          maxLength: 100
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Mario Vargas Llosa"


    ########################################
    #              CATEGORIES SCHEMAS
    ########################################

    CategoriesDto:
      type: object
      properties:
        categoryId:
          type: integer
          example: 5
        nameCategory:
          type: string
          example: "Ciencia Ficción"
        subtopicCategory:
          type: string
          example: "Robots"

    CategoriesCreatedDh:
      type: object
      required:
        - nameCategory
      properties:
        nameCategory:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Fantasía"
        subtopicCategory:
          type: string
          maxLength: 30
          example: "Épica"

    CategoriesUpdatedDh:
      type: object
      required:
        - categoryId
        - nameCategory
      properties:
        categoryId:
          type: integer
          minimum: 1
          example: 3
        nameCategory:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[\\p{L} .'’\\-]+$"
          example: "Distopía"
        subtopicCategory:
          type: string
          maxLength: 30
          example: "Política"


    ########################################
    #              USERS SCHEMAS
    ########################################

    UsersDto:
      type: object
      properties:
        userId:
          type: integer
          example: 8
        fullname:
          type: string
          example: "Juan Carlos Díez"
        dni:
          type: string
          example: "44556677X"
        address:
          type: string
          example: "Calle Verde 15; 2 - E"
        city:
          type: string
          example: "Sevilla"
        province:
          type: string
          example: "Andalucía"
        postalCode:
          type: string
          example: "41001"
        country:
          type: string
          example: "España"
        phone:
          type: string
          example: "+34600000010"
        email:
          type: string
          example: "carlos@example.com"
        password:
          type: string
          example: "********"
        registrationDate:
          type: string
          example: "2026/01/25"
        userDrop:
          type: boolean
          example: false
        daysDisciplinary:
          type: integer
          example: 0
        role:
          $ref: '#/components/schemas/RoleEnum'



    UsersCreatedDh:
      type: object
      required:
        - fullname
        - dni
        - phone
        - email
        - password
      properties:
        fullname:
          type: string
          maxLength: 120
          pattern: "^[\\p{L}0-9\\s\\.,'’\\-\\u00B7]*$"
          example: "Carlos Díez"
        dni:
          type: string
          maxLength: 20
          example: "44556677X"
        address:
          type: string
          maxLength: 100
          example: "Calle Verde 13; 1 - D"
        city:
          type: string
          maxLength: 40
          example: "Sevilla"
        province:
          type: string
          maxLength: 30
          example: "Andalucía"
        postalCode:
          type: string
          maxLength: 20
          pattern: "^[A-Za-z0-9\\s\\-]{3,12}$"
          example: "41001"
        country:
          type: string
          maxLength: 30
          example: "España"
        phone:
          type: string
          maxLength: 16
          pattern: "^\\+?[0-9\\s\\-()]{6,20}$"
          example: "+34600000010"
        email:
          type: string
          maxLength: 120
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
          example: "carlos@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 25
          pattern: "^(?=(?:.*[A-Z]){2,})(?=(?:.*[a-z]){2,})(?=.*\\d).{8,25}$"
          example: "CARLOSdiez13"
        role:
          $ref: '#/components/schemas/RoleEnum'



    UsersUpdatedDh:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          minimum: 1
          example: 8
        fullname:
          type: string
          maxLength: 120
          pattern: "^[\\p{L}0-9\\s\\.,'’\\-\\u00B7]*$"
          example: "Juan Carlos Díez Cocoliso"
        address:
          type: string
          maxLength: 100
          example: "Calle Verde 15; 2 - E"
        city:
          type: string
          maxLength: 40
          example: "Sevilla"
        province:
          type: string
          maxLength: 30
          example: "Andalucía"
        postalCode:
          type: string
          maxLength: 20
          pattern: "^[A-Za-z0-9\\s\\-]{3,12}$"
          example: "41001"
        country:
          type: string
          maxLength: 30
          example: "España"
        phone:
          type: string
          maxLength: 16
          pattern: "^\\+?[0-9\\s\\-()]{6,20}$"
          example: "+34600000010"
        email:
          type: string
          maxLength: 120
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
          example: "carlos@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 25
          pattern: "^(?=(?:.*[A-Z]){2,})(?=(?:.*[a-z]){2,})(?=.*\\d).{8,25}$"
          example: "CARLOSdiez13"
        userDrop:
          type: boolean
          example: false
        daysDisciplinary:
          type: integer
          minimum: 0
          example: 0
        role:
          $ref: '#/components/schemas/RoleEnum'


