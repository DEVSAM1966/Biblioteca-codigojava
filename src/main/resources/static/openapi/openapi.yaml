    #              USERS SCHEMAS
    ########################################

    UsersDto:
      type: object
      properties:
        userId:
          type: integer
          example: 8
        fullname:
          type: string
          example: "Juan Carlos Díez"
        dni:
          type: string
          example: "44556677X"
        address:
          type: string
          example: "Calle Verde 15; 2 - E"
        city:
          type: string
          example: "Sevilla"
        province:
          type: string
          example: "Andalucía"
        postalCode:
          type: string
          example: "41001"
        country:
          type: string
          example: "España"
        phone:
          type: string
          example: "+34600000010"
        email:
          type: string
          example: "carlos@example.com"
        password:
          type: string
          example: "********"
        registrationDate:
          type: string
          example: "2026/01/25"
        userDrop:
          type: boolean
          example: false
        daysDisciplinary:
          type: integer
          example: 0
        role:
          $ref: '#/components/schemas/RoleEnum'



    UsersCreatedDh:
      type: object
      required:
        - fullname
        - dni
        - phone
        - email
        - password
      properties:
        fullname:
          type: string
          maxLength: 120
          pattern: "^[\\p{L}0-9\\s\\.,'’\\-\\u00B7]*$"
          example: "Carlos Díez"
        dni:
          type: string
          maxLength: 20
          example: "44556677X"
        address:
          type: string
          maxLength: 100
          example: "Calle Verde 13; 1 - D"
        city:
          type: string
          maxLength: 40
          example: "Sevilla"
        province:
          type: string
          maxLength: 30
          example: "Andalucía"
        postalCode:
          type: string
          maxLength: 20
          pattern: "^[A-Za-z0-9\\s\\-]{3,12}$"
          example: "41001"
        country:
          type: string
          maxLength: 30
          example: "España"
        phone:
          type: string
          maxLength: 16
          pattern: "^\\+?[0-9\\s\\-()]{6,20}$"
          example: "+34600000010"
        email:
          type: string
          maxLength: 120
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
          example: "carlos@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 25
          pattern: "^(?=(?:.*[A-Z]){2,})(?=(?:.*[a-z]){2,})(?=.*\\d).{8,25}$"
          example: "CARLOSdiez13"
        role:
          $ref: '#/components/schemas/RoleEnum'



    UsersUpdatedDh:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          minimum: 1
          example: 8
        fullname:
          type: string
          maxLength: 120
          pattern: "^[\\p{L}0-9\\s\\.,'’\\-\\u00B7]*$"
          example: "Juan Carlos Díez Cocoliso"
        address:
          type: string
          maxLength: 100
          example: "Calle Verde 15; 2 - E"
        city:
          type: string
          maxLength: 40
          example: "Sevilla"
        province:
          type: string
          maxLength: 30
          example: "Andalucía"
        postalCode:
          type: string
          maxLength: 20
          pattern: "^[A-Za-z0-9\\s\\-]{3,12}$"
          example: "41001"
        country:
          type: string
          maxLength: 30
          example: "España"
        phone:
          type: string
          maxLength: 16
          pattern: "^\\+?[0-9\\s\\-()]{6,20}$"
          example: "+34600000010"
        email:
          type: string
          maxLength: 120
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
          example: "carlos@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 25
          pattern: "^(?=(?:.*[A-Z]){2,})(?=(?:.*[a-z]){2,})(?=.*\\d).{8,25}$"
          example: "CARLOSdiez13"
        userDrop:
          type: boolean
          example: false
        daysDisciplinary:
          type: integer
          minimum: 0
          example: 0
        role:
          $ref: '#/components/schemas/RoleEnum'

    UsersChangePassword:
      type: object
      required:
        - dni
        - email
        - phone
        - password
        - passwordRepeat
      properties:
        dni:
          type: string
          maxLength: 20
          example: "12345678A"
        email:
          type: string
          maxLength: 120
          example: "user@example.com"
        phone:
          type: string
          maxLength: 16
          example: "+34123456789"
        password:
          type: string
          minLength: 8
          maxLength: 25
          example: "NewPasswordAA1"
        passwordRepeat:
          type: string
          minLength: 8
          maxLength: 25
          example: "NewPasswordAA1"


